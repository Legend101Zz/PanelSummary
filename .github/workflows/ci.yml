name: ci

on:
  pull_request:
    branches: [release/v0.1, release/v0.2, main]
  push:
    branches: [release/v0.1, release/v0.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGODB_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt
      - name: Install backend dependencies
        run: uv pip install --system -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

  typescript:
    name: typescript (tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: agent-runtime
        working-directory: packages/agent-runtime
        run: npx tsc --noEmit && npx vitest run
      - name: manga-render
        working-directory: packages/manga-render
        run: npx tsc --noEmit && npx vitest run
      - name: agent-worker
        working-directory: apps/agent-worker
        run: npx tsc --noEmit && npx vitest run

  frontend:
    name: frontend (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
